name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يسمح بتشغيل البناء يدوياً

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. إعداد جافا (بدون كاش لتجنب الخطأ السابق)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. إعطاء صلاحيات التنفيذ لملف gradlew
    - name: Grant execute permission for gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        elif [ -f "android/gradlew" ]; then
          chmod +x android/gradlew
        fi

    # 4. بناء التطبيق (يكتشف تلقائياً مكان المشروع سواء في الجذر أو داخل مجلد android)
    - name: Build Debug APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -f "android/gradlew" ]; then
          cd android && ./gradlew assembleDebug
        else
          echo "لم يتم العثور على gradlew. تأكد من رفع ملفات Gradle Wrapper."
          exit 1
        fi

    # 5. رفع ملف الـ APK
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: SubGenius-Debug-APK
        # الكود يبحث عن الملف في المسارين المحتملين
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
