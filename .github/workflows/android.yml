name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يسمح لك بتشغيل البناء يدوياً من صفحة Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود من المستودع
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. إعداد بيئة جافا (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. إعطاء صلاحيات التنفيذ لملف gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. بناء نسخة الـ Debug (لا تحتاج أي مفاتيح توقيع)
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 5. رفع ملف الـ APK الناتج ليكون متاحاً للتحميل
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: SubGenius-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7 # سيحتفظ بالملف لمدة 7 أيام
