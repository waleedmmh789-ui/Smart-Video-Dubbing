name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # إن وُجد ملف ZIP في جذر المستودع يُفك داخل project/، وإلا يُستخدم محتوى المستودع نفسه
      - name: Extract ZIP project
        run: |
          mkdir -p project
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP"
            unzip -q -o "$ZIP" -d project
          else
            echo "No zip found; using repository files"
            rsync -a --exclude project --exclude .git ./ project/
          fi

      # يبحث عن مجلد مشروع Gradle (حتى لو كان داخل مجلد فرعي بعد فك الضغط)
      - name: Locate Gradle project
        id: loc
        run: |
          SETTINGS=$(find project -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::لم يتم العثور على settings.gradle داخل المشروع. تأكد أن الـ ZIP يحتوي على مشروع أندرويد كامل."
            find project -maxdepth 3 | head -n 50
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # حل تعارض ملف libc++_shared.so بين المكتبات الأصلية تلقائياً
      - name: Fix duplicate libc++_shared.so in app build gradle
        run: |
          APP_DIR="${{ steps.loc.outputs.dir }}/app"
          if [ -f "$APP_DIR/build.gradle.kts" ]; then
            if ! grep -q 'libc++_shared.so' "$APP_DIR/build.gradle.kts"; then
              python3 -c '
from pathlib import Path
p = Path("'"$APP_DIR/build.gradle.kts"'")
txt = p.read_text(encoding="utf-8")
block = """
android {
    packaging {
        jniLibs {
            pickFirsts += listOf("**/libc++_shared.so")
        }
    }
}
"""
p.write_text(txt + "\n" + block, encoding="utf-8")
'
              echo "Patched app/build.gradle.kts with pickFirst for libc++_shared.so"
            fi
          elif [ -f "$APP_DIR/build.gradle" ]; then
            if ! grep -q 'libc++_shared.so' "$APP_DIR/build.gradle"; then
              python3 -c '
from pathlib import Path
p = Path("'"$APP_DIR/build.gradle"'")
txt = p.read_text(encoding="utf-8")
block = """
android {
    packaging {
        jniLibs {
            pickFirsts += ["**/libc++_shared.so"]
        }
    }
}
"""
p.write_text(txt + "\n" + block, encoding="utf-8")
'
              echo "Patched app/build.gradle with pickFirst for libc++_shared.so"
            fi
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
